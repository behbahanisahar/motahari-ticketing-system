# LAN / intranet production (192.168.113.239)

Run **on the production machine** (the PC/server that owns `192.168.113.239`):

```bash
docker compose -f docker-compose.yml -f docker-compose.lan.yml up --build -d
```

Open: **http://192.168.113.239:8080**

services:
  backend:
    environment:
      CORS_ORIGIN: >-
        http://192.168.113.239:8080,
        http://192.168.113.239,
        http://localhost:8080,
        http://localhost:4000,
        http://localhost
      COOKIE_SECURE: "false"
      JWT_SECRET: change-me-to-a-long-random-production-secret

  frontend:
    ports:
      - "8080:80"
