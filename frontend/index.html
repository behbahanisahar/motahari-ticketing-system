<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>تیک‌یار — سامانه پشتیبانی فنی</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
    <link rel="apple-touch-icon" href="/logo.svg?v=2" />
    <meta name="theme-color" content="#0F766E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("tickyar-theme");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.classList.toggle("light", theme === "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <!--
      Note for IT: if this system is fully offline / air-gapped, download the
      Vazirmatn font files and self-host them instead of using Google Fonts CDN.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
